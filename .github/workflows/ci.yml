name: Standalone presentation validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build independent presentation
        run: npm run build
      - name: Verify presentation output
        run: test -f dist/presentation.html
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test presentation in browser
        run: npm run test:e2e
      - name: Save browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-ui-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
